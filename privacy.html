<h1>Privacy policy</h1>
<p>ferma-backup is a personal tool used only by its owner. It accesses only the files it creates in the owner's own Google Drive (scope drive.file) to store encrypted backups of the owner's server.</p>
<p>No data is collected from, shared with, or sold to anyone. No other users are served.</p>
